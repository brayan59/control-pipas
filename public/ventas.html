<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Venta directa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>🧾 Venta directa</h1>
      <div class="subtitulo">Para clientes nuevos, sin credencial (una sola vez)</div>
    </div>

    <div class="contenido">
      <div class="tarjeta">
        <form id="form-venta">
          <label>Nombre</label>
          <input type="text" id="nombre" required placeholder="Nombre de quien compra">

          <label>Placas (opcional)</label>
          <input type="text" id="placas" placeholder="Ej. ABC1234">

          <label>Monto cobrado (opcional)</label>
          <input type="number" id="monto" placeholder="$" min="0" step="0.01">

          <label>Notas</label>
          <textarea id="notas" rows="2" placeholder="Cualquier detalle extra"></textarea>

          <label>Registrado por</label>
          <input type="text" id="registradoPor" placeholder="Tu nombre">

          <button type="submit" class="btn btn-primario">Guardar venta</button>
        </form>
        <div id="resultado"></div>
      </div>

      <div class="tarjeta">
        <h3 style="margin-bottom:6px;">Ventas recientes</h3>
        <ul class="lista-clientes" id="lista-ventas"></ul>
      </div>
    </div>

    <nav class="navinferior">
      <a class="navitem" href="index.html"><span class="icono">🏠</span>Inicio</a>
      <a class="navitem" href="escanear.html"><span class="icono">📷</span>Escanear</a>
      <a class="navitem activo" href="ventas.html"><span class="icono">🧾</span>Venta</a>
      <a class="navitem" href="clientes.html"><span class="icono">🪪</span>Clientes</a>
      <a class="navitem" href="reportes.html"><span class="icono">📊</span>Reportes</a>
    </nav>
  </div>

  <script src="js/ventas.js"></script>
</body>
</html>
